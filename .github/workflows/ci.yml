name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # No live LLM calls in CI: a cache miss is an error, and there is no API key here.
  INTAKE_LLM_OFFLINE: "1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests eval
      - run: ruff format --check src tests eval

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -m "not docker and not live_llm"

  eval:
    # The test-split eval from the committed caches (LLM answers and KoSIT results):
    # no API key, no Docker. Fails on any cache miss and on any escaped error.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: >-
          python -m eval.run --split test --provider openrouter
          --model anthropic/claude-haiku-5.5 --threshold 0.9
          --require-cached --max-escaped 0 --resamples 2000 --out "$RUNNER_TEMP/eval"

  kosit:
    # End-to-end R7 against the official KoSIT validator in Docker, like e-rechnung-inbox's
    # own kosit job. The image is built from e-rechnung-inbox at the pinned commit.
    runs-on: ubuntu-24.04
    env:
      INTAKE_REQUIRE_DOCKER: "1" # a missing validator is a failure here, not a skip
      ERECHNUNG_INBOX_SHA: 2e34c1405e82b67d42272188ad2e0eb5e72de150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RohithkumarReddipogula/e-rechnung-inbox
          ref: ${{ env.ERECHNUNG_INBOX_SHA }}
          path: .kosit-src
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Build validator image (pinned versions, SHA-256 verified by its Dockerfile)
        run: |
          IMAGE=$(python -c "from erechnung_inbox.validator import DEFAULT_IMAGE; print(DEFAULT_IMAGE)")
          docker build -t "$IMAGE" .kosit-src/docker/kosit-validator
      - run: pytest -m docker
