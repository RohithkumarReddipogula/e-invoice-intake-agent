[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "e-invoice-intake-agent"
version = "0.1.0"
description = "Intake agent for incoming invoices: extract, check, auto-approve only when sure."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Rohith Kumar Reddipogula", email = "rohithkumar336699@gmail.com" }]
dependencies = [
    "anthropic>=1.14",
    "e-rechnung-inbox @ git+https://github.com/RohithkumarReddipogula/e-rechnung-inbox@2e34c1405e82b67d42272188ad2e0eb5e72de150",
    "factur-x>=7.0",
    "fastapi>=0.140",
    "httpx>=0.28",
    "jinja2>=3.1",
    "lxml>=5.0",
    "mcp>=2.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pypdf>=5.0",
    "python-multipart>=0.0.20",
    # ZoneInfo("Europe/Berlin") on systems without a tz database (e.g. Windows)
    "tzdata>=2024.1",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "reportlab>=4.0",
    "ruff>=0.15",
]

[tool.hatch.metadata]
# e-rechnung-inbox is not on PyPI, so it is pinned to a git commit.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/intake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "docker: needs Docker and the KoSIT validator image from e-rechnung-inbox",
    "live_llm: calls the real LLM API; never runs in CI",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["intake"]
